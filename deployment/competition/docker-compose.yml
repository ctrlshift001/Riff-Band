name: ai4ms-competition

services:
  ai4ms-workbench:
    image: ai4ms-workbench:competition
    env_file:
      - .env.competition
    environment:
      AI4MS_DATA_DIR: /app/data
      AI4MS_HOST: 0.0.0.0
      AI4MS_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ai4ms-data:/app/data
    restart: unless-stopped

volumes:
  ai4ms-data:
